name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy sentencepiece
      - name: Parameter counts
        run: python code/llm/model.py
      - name: Byte-compile every script
        run: python -m py_compile code/llm/*.py
      - name: 20-step CPU smoke test
        run: python code/llm/smoke_test.py --steps 20
      - name: kill -9 resume determinism
        run: python code/llm/smoke_test.py --resume-check --steps 40
